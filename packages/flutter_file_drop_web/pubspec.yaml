name: flutter_file_drop_web
description: Web implementation for flutter_file_drop.
version: 0.1.0
repository: https://github.com/davidlondono/flutter-file-drop
issue_tracker: https://github.com/davidlondono/flutter-file-drop/issues

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_file_drop_platform_interface: ^0.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FlutterFileDropWebPlugin
        fileName: flutter_file_drop_web_web.dart
