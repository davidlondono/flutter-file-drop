name: flutter_file_drop
description: Headless cross-platform file and text drag-and-drop for Flutter.
version: 0.1.0
repository: https://github.com/davidlondono/flutter-file-drop
issue_tracker: https://github.com/davidlondono/flutter-file-drop/issues

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_file_drop_platform_interface: ^0.1.0
  flutter_file_drop_android: ^0.1.0
  flutter_file_drop_darwin: ^0.1.0
  flutter_file_drop_windows: ^0.1.0
  flutter_file_drop_linux: ^0.1.0
  flutter_file_drop_web: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_file_drop_android
      ios:
        default_package: flutter_file_drop_darwin
      macos:
        default_package: flutter_file_drop_darwin
      windows:
        default_package: flutter_file_drop_windows
      linux:
        default_package: flutter_file_drop_linux
      web:
        default_package: flutter_file_drop_web
